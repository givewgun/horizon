name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile=false

      - name: build shared (types used by other packages)
        run: pnpm --filter @horizon/shared build

      - name: typecheck
        run: pnpm -r typecheck

      - name: lint
        run: pnpm -r lint

      - name: test
        run: pnpm -r test
