services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: horizon:latest
    container_name: horizon-app
    restart: unless-stopped
    # No host port binding. Public exposure happens via the global Cloudflare
    # Tunnel container on the `tunnel-gateway` network. The tunnel routes
    # horizon.givewgun.com -> http://horizon-app:8080
    expose:
      - "8080"
    networks:
      - default
      - tunnel-gateway
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8080
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

networks:
  default:
  tunnel-gateway:
    external: true
