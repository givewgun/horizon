services:
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    image: horizon:latest
    container_name: horizon
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
    ports:
      # Bind ONLY to loopback. Public exposure happens via the existing
      # Cloudflare Tunnel:
      #   - hostname: horizon.givewgun.com
      #     service:  http://localhost:8080
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
